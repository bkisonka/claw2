# CI: build and test the gateway, web client, and PWA on pushes and PRs.
# Tests need no model provider or external services.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            web/package-lock.json
            pwa/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Build and test web client
        run: |
          npm --prefix web ci
          npm run build:web
          node --import tsx --test web/src/lib/*.test.ts web/src/store/*.test.ts
          node node_modules/vitest/vitest.mjs run web/src/browser web/src/api

      - name: Build and test PWA
        run: |
          # The web PWA does not run Capacitor's Android asset generator (Sharp).
          npm --prefix pwa ci --ignore-scripts
          npm --prefix pwa rebuild esbuild
          npm run build:pwa
          npm --prefix pwa test
