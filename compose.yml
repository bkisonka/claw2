# claw2 — single-container deployment: gateway, web interface and mobile web client.
# Skills run in the hard sandbox by default: as one-off sibling containers on
# an isolated docker network (see "Security" in the README). Their only egress
# point is the guard sidecar; the gateway reaches the host docker through a
# restricted API proxy, never through the socket itself.
# Конфигурация — в .claw2/claw2.yaml, секреты — в .env (см. README).

services:
  claw2:
    build: .
    image: claw2:latest
    container_name: claw2
    # Start as root: the entrypoint (docker-entrypoint.sh) fixes ownership of
    # the bind mounts (Docker auto-creates ./data as root on the first
    # `compose up`) and then drops to node via gosu — application code never
    # runs as root. Skill sibling containers keep the image's non-root USER.
    user: "0"
    ports:
      # Loopback only. To serve other devices: "8080:3000" — and enable
      # gateway.auth first (see README, "Security").
      # Только петлевой интерфейс. Для доступа с других устройств: "8080:3000"
      # — и предварительно включите gateway.auth (см. README, «Безопасность»).
      - "127.0.0.1:8080:3000"
    env_file: .env
    environment:
      - NODE_ENV=production
      # Hard skill sandbox (sibling containers): talk to the host docker via
      # the validating API guard, and map container paths to host paths for
      # sibling binds (${PWD} = the directory you run compose from).
      - DOCKER_HOST=tcp://docker-guard:2375
      - CLAW2_SIBLING_HOST_ROOT=${PWD}
    volumes:
      - ./.claw2:/app/.claw2
      # data/ keeps chat databases when gateway.chatsDbPath points here;
      # by default chats live inside .claw2/. Same directory on the host —
      # nothing is lost across rebuilds.
      # data/ хранит базы чатов, если gateway.chatsDbPath указывает сюда;
      # по умолчанию чаты живут внутри .claw2/. Каталог на хосте —
      # при пересборке ничего не теряется.
      - ./data:/app/data
      # Skills are plain files: edit on the host, the agent sees changes
      # on the next turn.
      # Навыки — обычные файлы: правьте на хосте, агент видит изменения
      # на следующем ходе.
      - ./agents:/app/agents
      # Container time = host time (reminders and schedules).
      # Время в контейнере = время на хосте (напоминания и расписания).
      - /etc/localtime:/etc/localtime:ro
    networks:
      - default
      # Only to reach the restricted docker API proxy.
      # Только для доступа к ограниченному прокси docker API.
      - sandbox-control
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - docker-guard
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Validating docker API guard (our own code, claw2 image): an endpoint
  # allowlist AND structural validation of every container creation — the
  # hardening profile is mandatory (cap-drop ALL, no-new-privileges,
  # read-only rootfs), privilege widening is rejected, bind sources must sit
  # inside the compose sandbox roots (${PWD}/agents, ${PWD}/data) with targets
  # under /app. A generic socket-proxy with CONTAINERS=1+POST=1 would still
  # admit a privileged host-mounting container create — this one does not.
  # Валидирующий guard docker API (наш код, образ claw2): allowlist endpoint'ов
  # и структурная валидация каждого создания контейнера — профиль изоляции
  # обязателен, расширение привилегий отклоняется, источники bind'ов — только
  # внутри корней песочницы compose и только под /app в контейнере.
  docker-guard:
    image: claw2:latest
    build: .
    container_name: claw2-docker-guard
    # Run the guard entry directly as root (no entrypoint drop): the node user
    # cannot read the root-owned docker.sock. The guard speaks ONLY to that
    # socket — no app data, no outbound network beyond sandbox-control.
    user: "0"
    entrypoint: ["node"]
    command: ["dist/sandbox/docker-guard-cli.js"]
    environment:
      - DOCKER_GUARD_PORT=2375
      - DOCKER_GUARD_SOCKET=/var/run/docker.sock
      # Anti self-removal: container-scoped API ops on this name are refused.
      - CLAW2_DOCKER_GUARD_SELF_NAME=claw2-docker-guard
      # Sandbox bind roots: skill containers may only mount host paths from
      # the compose working directory's agents/ and data/ trees.
      - CLAW2_DOCKER_GUARD_ALLOWED_BIND_SRC=${PWD}/agents:${PWD}/data
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - sandbox-control
    restart: unless-stopped

networks:
  # Reachable only from the gateway container.
  sandbox-control:
    internal: true
