# claw2 — single-container deployment: gateway, web interface and mobile web client.
# Skills run in the hard sandbox by default: as one-off sibling containers on
# an isolated docker network (see "Security" in the README). Their only egress
# point is the guard sidecar; the gateway reaches the host docker through a
# restricted API proxy, never through the socket itself.
# Конфигурация — в .claw2/claw2.yaml, секреты — в .env (см. README).

services:
  claw2:
    build: .
    image: claw2:latest
    container_name: claw2
    ports:
      # Loopback only. To serve other devices: "8080:3000" — and enable
      # gateway.auth first (see README, "Security").
      # Только петлевой интерфейс. Для доступа с других устройств: "8080:3000"
      # — и предварительно включите gateway.auth (см. README, «Безопасность»).
      - "127.0.0.1:8080:3000"
    env_file: .env
    environment:
      - NODE_ENV=production
      # Hard skill sandbox (sibling containers): talk to the host docker via
      # the restricted API proxy, and map container paths to host paths for
      # sibling binds (${PWD} = the directory you run compose from).
      - DOCKER_HOST=tcp://docker-proxy:2375
      - CLAW2_SIBLING_HOST_ROOT=${PWD}
    volumes:
      - ./.claw2:/app/.claw2
      # data/ keeps chat databases when gateway.chatsDbPath points here;
      # by default chats live inside .claw2/. Same directory on the host —
      # nothing is lost across rebuilds.
      # data/ хранит базы чатов, если gateway.chatsDbPath указывает сюда;
      # по умолчанию чаты живут внутри .claw2/. Каталог на хосте —
      # при пересборке ничего не теряется.
      - ./data:/app/data
      # Skills are plain files: edit on the host, the agent sees changes
      # on the next turn.
      # Навыки — обычные файлы: правьте на хосте, агент видит изменения
      # на следующем ходе.
      - ./agents:/app/agents
      # Container time = host time (reminders and schedules).
      # Время в контейнере = время на хосте (напоминания и расписания).
      - /etc/localtime:/etc/localtime:ro
    networks:
      - default
      # Only to reach the restricted docker API proxy.
      # Только для доступа к ограниченному прокси docker API.
      - sandbox-control
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    depends_on:
      - docker-proxy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  # Restricted docker API proxy: the gateway's docker CLI may manage skill
  # sandbox containers/networks and nothing else — no mounts of arbitrary
  # host paths, no daemon info beyond version, no swarm/volumes/images-push.
  # Ограниченный прокси docker API: docker CLI шлюза управляет только
  # контейнерами/сетями песочницы навыков — остальное запрещено.
  docker-proxy:
    image: tecnativa/docker-socket-proxy
    container_name: claw2-docker-proxy
    environment:
      # Deny by default; allow only what the skill sandbox needs. No exec:
      # sidecar readiness is the container's own HEALTHCHECK, inspected via
      # `docker inspect`.
      - CONTAINERS=1
      - IMAGES=1
      - INFO=1
      - NETWORKS=1
      - SYSTEM=1
      - LOGS=1
      - POST=1
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks:
      - sandbox-control
    restart: unless-stopped

networks:
  # Reachable only from the gateway container.
  sandbox-control:
    internal: true
